[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvp_tutor"
version = "0.1.0"
description = "Yamaha CVP-301 companion tutor app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt6==6.6.0",
  "PyQt6-Qt6==6.6.0",
  "PyQt6-sip==13.6.0",
  "mido==1.3.2",
  "python-rtmidi==1.5.8",
  "loguru==0.7.2",
  "music21==9.1.0"
]

license = "MIT"

[project.scripts]
cvp_tutor = "cvp_tutor.app:main"

[tool.setuptools.packages.find]
include = ["cvp_tutor", "cvp_tutor.*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0"
]

[project.urls]
Source = "https://github.com/joshuaparris-max/ParrisPiano"
